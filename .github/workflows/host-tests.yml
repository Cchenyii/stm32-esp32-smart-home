name: Host tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcjson-dev
          python -m pip install -r PC_Server/requirements-home.txt amqtt==0.11.3
      - name: Compile and run C tests
        run: |
          inc=STM32/Core/Inc
          src=STM32/Core/Src
          flags=(-std=c11 -Wall -Wextra -Werror -O2 -I "$inc")
          gcc "${flags[@]}" Tests/wire_test.c "$src/edge_wire.c" -o "$RUNNER_TEMP/wire-test"
          gcc "${flags[@]}" Tests/home_control_test.c "$src/edge_home.c" -o "$RUNNER_TEMP/home-control-test"
          gcc "${flags[@]}" Tests/settings_test.c "$src/edge_settings.c" "$src/edge_wire.c" -o "$RUNNER_TEMP/settings-test"
          gcc "${flags[@]}" Tests/oled_ui_test.c "$src/edge_oled_ui.c" "$src/edge_home.c" -o "$RUNNER_TEMP/oled-ui-test"
          gcc "${flags[@]}" -I ESP32/main $(pkg-config --cflags libcjson) \
            Tests/thingsboard_codec_test.c ESP32/main/gateway_home_codec.c \
            "$src/edge_wire.c" $(pkg-config --libs libcjson) -o "$RUNNER_TEMP/thingsboard-codec-test"
          "$RUNNER_TEMP/wire-test"
          "$RUNNER_TEMP/home-control-test"
          "$RUNNER_TEMP/oled-ui-test"
          "$RUNNER_TEMP/settings-test"
          "$RUNNER_TEMP/thingsboard-codec-test"
      - name: Test the ThingsBoard widget
        run: node Tests/thingsboard_widget_test.js
      - name: Run Python loopback integration tests
        run: python -m unittest discover -s Tests -v
